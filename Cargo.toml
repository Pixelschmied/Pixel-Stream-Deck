[workspace]
resolver = "2"
members = ["crates/deck-core", "src-tauri"]
# src-tauri depends on system webkit libraries; build it locally or in an
# environment where those dev packages are installed.

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/Pixelschmied/Pixel-Stream-Deck"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
